substitutions:
  _REGION: us-central1
  _API_SERVICE: company-api
  _WEB_SERVICE: company-web
  _FIREBASE_PROJECT_ID: replace-me
  _APP_OWNER_UID: replace-me
  _APP_COLLABORATOR_UID: replace-me
  _GCS_BUCKET: replace-me-private-bucket
  _CLOUD_SQL_INSTANCE: replace-me:us-central1:collaboration
  _RUNTIME_SERVICE_ACCOUNT: replace-me@replace-me.iam.gserviceaccount.com
  _WEB_ORIGIN: https://workspace.example.com
  _NEXT_PUBLIC_API_URL: https://api.example.com/api
  _NEXT_PUBLIC_SOCKET_URL: https://api.example.com
  _FIREBASE_WEB_API_KEY: replace-me
  _FIREBASE_WEB_AUTH_DOMAIN: replace-me.firebaseapp.com
  _FIREBASE_WEB_PROJECT_ID: replace-me
  _FIREBASE_WEB_APP_ID: replace-me

steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/api/Dockerfile, -t, gcr.io/$PROJECT_ID/company-api:$COMMIT_SHA, .]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/company-web:$COMMIT_SHA
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SOCKET_URL=${_NEXT_PUBLIC_SOCKET_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_WEB_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_WEB_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_WEB_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_WEB_APP_ID}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/company-api:$COMMIT_SHA]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/company-web:$COMMIT_SHA]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --image=gcr.io/$PROJECT_ID/company-api:$COMMIT_SHA
      - --allow-unauthenticated
      - --port=4000
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},WEB_ORIGIN=${_WEB_ORIGIN},APP_OWNER_UID=${_APP_OWNER_UID},APP_COLLABORATOR_UID=${_APP_COLLABORATOR_UID},GCS_BUCKET=${_GCS_BUCKET}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --image=gcr.io/$PROJECT_ID/company-web:$COMMIT_SHA
      - --allow-unauthenticated
      - --port=3000

images:
  - gcr.io/$PROJECT_ID/company-api:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/company-web:$COMMIT_SHA
