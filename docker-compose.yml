services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: collaboration
      POSTGRES_USER: collaboration
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collaboration -d collaboration"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
